; =======================================================
; KVMSwitch 显示器输入源快速切换配置文件
; =======================================================

[General]
; 运行模式:
; tray   - 启动后常驻系统托盘，单击/右击托盘图标弹出切换菜单 (推荐)
; menu   - 点击时弹出快捷选择菜单 (单次运行)
; toggle - 点击直接在 toggle_inputs 中轮流切换 (适合作为快捷方式一键切换)
mode = tray

; 切换成功后是否显示桌面气泡通知 (true / false)
notify = true

; 目标显示器:
; primary - 仅切换主显示器 (推荐)
; all     - 同时切换所有连接的支持 DDC/CI 的显示器
target_monitor = primary

; toggle 轮换模式下循环切换的输入源列表 (逗号分隔)
; 支持名称: DP, HDMI1, HDMI2, TypeC 或具体数值 15, 17, 18, 16
toggle_inputs = DP, HDMI1, TypeC

[Inputs]
; 输入源名称与 VCP 0x60 数值映射 (泰坦军团 P275MV: DP 为 16, Type-C 为 15)
DP = 16
DP1 = 16
HDMI1 = 17
HDMI2 = 18
TypeC = 15

[Commands]
; 切换到指定输入源后自动在后台执行的系统命令 (可选，留空则不执行)
; 例如切换到 Mac 时唤醒 Mac，切换回 PC 时联动等:
on_switch_to_typec = ssh mac caffeinate -u -t 2
on_switch_to_hdmi1 =
on_switch_to_hdmi2 = 
on_switch_to_dp = 

[Presets]
; 多显示器预设方案 (与 macOS 端预设保持一致，一键联动切换所有显示器)
; 格式: 预设名称 = 显示器标识:输入源, 显示器标识:输入源 ...
; 显示器标识支持: 1, 2, primary, secondary, 设备名或显示器描述
; 输入源支持: DP, HDMI1, HDMI2, TypeC 或数值代码 (15, 16, 17 等)，0 表示保持不变
; 示例：
; 办公模式 = 1:DP, 2:TypeC
; 娱乐模式 = 1:HDMI1, 2:HDMI2
双屏办公 = 1:DP, 2:TypeC
娱乐影音 = 1:HDMI1, 2:HDMI2
